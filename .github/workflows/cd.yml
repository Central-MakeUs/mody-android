name: CD

# 태그로 배포 트랙 분기
#   vX.Y.Z-dev  -> Firebase App Distribution (debug APK, 내부 테스트)
#   vX.Y.Z      -> Google Play Store (release AAB, 프로덕션 단계적 출시)
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 허용: v1.2.3 (release) | v1.2.3-dev (Firebase)
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-dev)?$ ]]; then
            echo "::error::잘못된 태그: $GITHUB_REF_NAME (예: v1.2.3 또는 v1.2.3-dev)"
            exit 1
          fi
          # 자릿수 상한은 오타 방지용이다(v1.10.0 을 v1.100 처럼 잘못 치는 경우).
          # versionCode 는 더 이상 이 값에서 계산하지 않는다 — 태그 개수로 매긴다.
          CORE="${GITHUB_REF_NAME#v}"; CORE="${CORE%-dev}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CORE"
          if (( 10#$MAJOR > 99 || 10#$MINOR > 99 || 10#$PATCH > 99 )); then
            echo "::error::각 자리는 0~99만 허용: $GITHUB_REF_NAME (오타 의심)"
            exit 1
          fi

  firebase:
    name: Firebase (dev)
    needs: validate
    if: endsWith(github.ref_name, '-dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 이후 스텝에 인증 git 작업 없음 → 토큰을 .git/config 에 남기지 않는다
          persist-credentials: false
          # versionCode 를 태그 개수로 매기므로 전체 태그가 필요하다. 기본(depth 1)은
          # 빌드 중인 태그 하나만 받아 와 개수가 항상 1 이 된다. persist-credentials 를
          # 끄면 이후 git fetch 가 인증을 못 하므로, 여기서 다 받아둔다.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # versionCode = 지금까지 찍은 릴리스 태그 수(= 이번 배포의 순번).
      #
      # 예전엔 버전명에서 계산했다(MAJOR*10000 + MINOR*100 + PATCH). 단조 증가는 보장되지만
      # 0.2.2 -> 1.1.0 에서 202 -> 10100 처럼 값이 크게 튀어 읽기 어려웠다. 사용자에게
      # 보이는 건 versionName 이고 versionCode 는 "몇 번째 빌드인가"만 뜻하면 된다.
      #
      # 주의: 태그를 지우면 개수가 줄어 versionCode 가 되돌아간다. 안드로이드는 더 낮은
      # versionCode 설치를 거부하므로 배포한 태그는 지우지 않는다.
      - name: Resolve version
        run: |
          CORE="${GITHUB_REF_NAME#v}"; CORE="${CORE%-dev}"
          # 빌드 중인 태그도 이미 원격에 있으므로 개수에 포함된다.
          CODE=$(git tag -l 'v*' | wc -l | tr -d ' ')
          if [ "$CODE" -lt 1 ]; then
            echo "::error::태그를 못 찾았다 — versionCode 를 셀 수 없다(fetch-depth 확인)."
            exit 1
          fi
          echo "VERSION_NAME=$CORE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName=$CORE versionCode=$CODE"

      - name: Resolve release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # actions/checkout이 태그 ref를 커밋 SHA로 덮어써 annotated 메시지가 유실되므로
          # (actions/checkout#290) 로컬 git이 아닌 GitHub API로 태그 객체의 메시지를 조회한다.
          # annotated 태그면 ref가 tag 객체를 가리키고, lightweight면 commit → 빈값 → 폴백.
          NOTES=""
          TAG_OBJ_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
            --jq 'select(.object.type == "tag") | .object.sha' 2>/dev/null || true)
          if [ -n "$TAG_OBJ_SHA" ]; then
            NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJ_SHA}" --jq '.message' 2>/dev/null || true)
          fi
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            NOTES="$GITHUB_REF_NAME (커밋 ${GITHUB_SHA:0:7})"
          fi
          printf '%s\n' "$NOTES" > release_notes.txt
          echo "----- release notes -----"; cat release_notes.txt

      - name: Build Debug APK
        env:
          # 카카오 네이티브 키 주입(미주입 시 빈 값으로 빌드되어 카카오 로그인/공유 동작 안 함)
          KAKAO_NATIVE_KEY_DEV: ${{ secrets.KAKAO_NATIVE_KEY_DEV }}
        run: ./gradlew assembleDebug

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: jagsim
          file: app/build/outputs/apk/debug/app-debug.apk
          releaseNotesFile: release_notes.txt

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI=":rocket:"; TITLE="테스트앱 배포 완료"
          else
            EMOJI=":x:"; TITLE="테스트앱 배포 실패"
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${EMOJI} Mody ${TITLE}\n버전: ${GITHUB_REF_NAME}\n커밋: ${GITHUB_SHA:0:7} (${GITHUB_ACTOR})\nFirebase App Distribution · 그룹 jagsim\"}" \
            "$SLACK_WEBHOOK_URL" || true

  playstore:
    name: Play Store (release)
    needs: validate
    if: ${{ !endsWith(github.ref_name, '-dev') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # versionCode 를 태그 개수로 매긴다(firebase 잡 주석 참고).
          fetch-depth: 0

      # release 서명은 JDK 21 이어야 한다 — 17 에서는 keystore(PKCS12) 비번이 틀렸다고 나온다.
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        run: |
          CORE="${GITHUB_REF_NAME#v}"
          CODE=$(git tag -l 'v*' | wc -l | tr -d ' ')
          if [ "$CODE" -lt 1 ]; then
            echo "::error::태그를 못 찾았다 — versionCode 를 셀 수 없다(fetch-depth 확인)."
            exit 1
          fi
          echo "VERSION_NAME=$CORE" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "versionName=$CORE versionCode=$CODE"

      # Play 출시 노트(ko-KR). annotated 태그 메시지를 쓰고, 없으면 실패시킨다 —
      # 사용자에게 "v1.2.1 (커밋 abc1234)" 같은 문구가 나가면 안 된다.
      - name: Resolve release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=""
          TAG_OBJ_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" \
            --jq 'select(.object.type == "tag") | .object.sha' 2>/dev/null || true)
          if [ -n "$TAG_OBJ_SHA" ]; then
            NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJ_SHA}" --jq '.message' 2>/dev/null || true)
          fi
          if [ -z "${NOTES//[[:space:]]/}" ]; then
            echo "::error::출시 노트가 없다. annotated 태그로 찍는다: git tag -a ${GITHUB_REF_NAME} -m \"<출시 노트>\""
            exit 1
          fi
          # Play 출시 노트 상한 500자.
          if [ "$(printf '%s' "$NOTES" | wc -m)" -gt 500 ]; then
            echo "::error::출시 노트가 500자를 넘는다."
            exit 1
          fi
          mkdir -p whatsnew
          printf '%s\n' "$NOTES" > whatsnew/whatsnew-ko-KR
          echo "----- release notes -----"; cat whatsnew/whatsnew-ko-KR

      - name: Decode keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release AAB
        env:
          KAKAO_NATIVE_KEY_PROD: ${{ secrets.KAKAO_NATIVE_KEY_PROD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      # 업로드 전에 산출물을 직접 확인한다. 빌드 성공만으로는 Play 제출 단계에서 막히는 것들이다.
      - name: Verify AAB
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          MANIFEST=$(unzip -p "$AAB" base/manifest/AndroidManifest.xml | strings)
          # 광고 권한이 라이브러리로 다시 끌려오면 "광고 ID 사용: 아니요" 제출이 막힌다.
          if printf '%s' "$MANIFEST" | grep -qE 'permission\.(AD_ID|ACCESS_ADSERVICES)'; then
            echo "::error::광고 권한이 AAB 에 들어 있다:"
            printf '%s' "$MANIFEST" | grep -E 'permission\.(AD_ID|ACCESS_ADSERVICES)'
            exit 1
          fi
          # 서명이 debug 키로 빠지지 않았는지(키 별칭이 debug 면 Play 가 거부한다).
          if jarsigner -verify -verbose -certs "$AAB" | grep -q 'CN=Android Debug'; then
            echo "::error::debug 키로 서명됐다."
            exit 1
          fi

      # 프로덕션 단계적 출시 20%. 문제가 없으면 Play Console 에서 100% 로 올린다.
      # 서비스 계정은 Play Console > 사용자 및 권한에 "출시 관리" 권한으로 초대돼 있어야 한다.
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.makeus.mody
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          track: production
          status: inProgress
          userFraction: 0.2
          whatsNewDirectory: whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
        run: |
          if [ "$STATUS" = "success" ]; then
            EMOJI=":rocket:"; TITLE="Play 스토어 업로드 완료(단계적 출시 20%)"
          else
            EMOJI=":x:"; TITLE="Play 스토어 업로드 실패"
          fi
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"${EMOJI} Mody ${TITLE}\n버전: ${GITHUB_REF_NAME} (versionCode ${VERSION_CODE:-?})\n커밋: ${GITHUB_SHA:0:7} (${GITHUB_ACTOR})\"}" \
            "$SLACK_WEBHOOK_URL" || true
